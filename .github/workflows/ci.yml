name: PR 18790 review verification
on:
  push:
    branches: [codex/verify-18790-review]
  workflow_dispatch:
    inputs:
      code_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  selection-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref || '5e383c4f6769fdba28cac6f50644ab6b448590f5' }}
      - name: Selection readiness failure propagation
        run: |
          cat > /tmp/selection_regression.py <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile
          import os
          
          root = pathlib.Path.cwd()
          processing = (root / 'src/MaaCore/Task/Infrast/InfrastProcessingTask.cpp').read_text(encoding='utf-8')
          plugin = (root / 'src/MaaCore/Task/MiniGame/MaterialSynthesisTaskPlugin.cpp').read_text(encoding='utf-8')
          
          def extract(source, signature):
              start = source.index(signature)
              brace = source.index('{', start)
              depth = 1
              end = brace + 1
              while depth:
                  depth += (source[end] == '{') - (source[end] == '}')
                  end += 1
              return source[start:end]
          
          # Execute the actual confirmation and caller bodies. The external UI and
          # operator scan are controlled doubles; no matching or full task-flow claim.
          prefix = r'''
          #include <iostream>
          #include <initializer_list>
          #include <string>
          struct Scenario {
              bool ready = true, cancel_on_ready = false, cancelled = false;
              bool candidate = true, changed = true, confirmation = true, open = true, workshop = true;
              int ready_calls = 0, fallback_calls = 0;
          } state;
          bool task(const std::string& name) {
              if (name.ends_with("OperatorSelectionReady")) {
                  ++state.ready_calls;
                  if (state.cancel_on_ready) { state.cancelled = true; return true; }
                  return state.ready;
              }
              if (name == "InfrastDormConfirmButton") return state.confirmation;
              if (name.ends_with("OpenOperatorList")) return state.open;
              throw name;
          }
          namespace asst {
          struct InfrastProcessingTask {
              bool need_exit() const { return state.cancelled; }
              bool confirm_material_synthesis_selection();
              bool select_operator(const std::string&, int, bool& changed) {
                  changed = false;
                  if (!state.candidate || !confirm_material_synthesis_selection()) return false;
                  changed = state.changed;
                  return true;
              }
          };
          struct ProcessTask {
              std::string name;
              ProcessTask(InfrastProcessingTask&, std::initializer_list<const char*> names): name(*names.begin()) {}
              void set_retry_times(int) {}
              bool run() { return task(name); }
          };
          struct MaterialSynthesisTaskPlugin {
              enum class Result { Completed, InsufficientResources, OperatorUnavailable, Unsupported, NavigationFailed, Cancelled };
              bool need_exit() const { return state.cancelled; }
              bool run_task(const std::string& name, int = 3) { return task(name); }
              bool return_to_workshop() { ++state.fallback_calls; return state.workshop; }
              Result select_processing_operator(const std::string&, int, bool, bool&, InfrastProcessingTask&);
          };
          }
          '''
          suffix = r'''
          int main() {
              using Plugin = asst::MaterialSynthesisTaskPlugin;
              using Result = Plugin::Result;
              int failures = 0, tests = 0;
              auto check = [&](const char* name, Scenario scenario, bool missing, Result expected, bool expected_changed, int fallback) {
                  state = scenario;
                  Plugin plugin;
                  asst::InfrastProcessingTask processing;
                  bool changed = false;
                  const auto result = plugin.select_processing_operator("30013", 3, missing, changed, processing);
                  ++tests;
                  // Changed state is only usable when the complete selection is ready.
                  const bool passed = result == expected && state.fallback_calls == fallback &&
                      (expected != Result::Completed || changed == expected_changed);
                  std::cout << (passed ? "PASS " : "FAIL ") << name << " result=" << int(result)
                            << " expected=" << int(expected) << " changed=" << changed
                            << " fallback=" << state.fallback_calls << '\n';
                  failures += !passed;
              };
              check("readiness timeout with incumbent", {.ready=false}, false, Result::NavigationFailed, false, 0);
              check("readiness timeout with empty slot", {.ready=false}, true, Result::NavigationFailed, false, 0);
              check("cancellation reported as successful ProcessTask", {.cancel_on_ready=true}, false, Result::Cancelled, false, 0);
              check("changed operator ready", {}, false, Result::Completed, true, 0);
              check("same operator ready", {.changed=false}, false, Result::Completed, false, 0);
              check("same operator readiness timeout", {.ready=false, .changed=false}, false, Result::NavigationFailed, false, 0);
              check("no candidate keeps incumbent", {.candidate=false}, false, Result::Completed, false, 1);
              check("no candidate and empty slot", {.candidate=false}, true, Result::OperatorUnavailable, false, 1);
              check("cannot return after no candidate", {.candidate=false, .workshop=false}, false, Result::NavigationFailed, false, 1);
              check("cannot open operator list", {.open=false}, false, Result::NavigationFailed, false, 0);
              std::cout << tests << " cases; " << failures << " failures\n";
              return failures ? 1 : 0;
          }
          '''
          with tempfile.TemporaryDirectory() as directory:
              source = pathlib.Path(directory) / 'selection.cpp'
              binary = pathlib.Path(directory) / ('selection.exe' if os.name == 'nt' else 'selection')
              source.write_text(prefix + extract(processing, 'bool asst::InfrastProcessingTask::confirm_material_synthesis_selection()') + '\n' + extract(plugin, 'asst::MaterialSynthesisTaskPlugin::Result asst::MaterialSynthesisTaskPlugin::select_processing_operator(') + suffix, encoding='utf-8')
              if os.name == 'nt':
                  command = ['cl', '/nologo', '/std:c++20', '/Od', '/Zi', '/W4', '/WX', '/EHsc', str(source), '/Fe:' + str(binary)]
              else:
                  command = ['g++', '-std=c++20', '-O0', '-g', '-Wall', '-Wextra', '-Werror', str(source), '-o', str(binary)]
              subprocess.run(command, check=True)
              sys.exit(subprocess.run([str(binary)]).returncode)
          PY
          python /tmp/selection_regression.py
  debug:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref }}
      - name: Fetch MaaUtils
        shell: bash
        run: bash .github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils
      - uses: actions/cache@v6
        id: deps-cache
        with:
          path: src/MaaUtils/MaaDeps
          key: issue-18622-windows-maadeps-${{ hashFiles('tools/maadeps-download.py') }}
      - name: Dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/maadeps-download.py x64-windows
      - name: Build Debug
        run: |
          cmake --preset windows-x64 -DBUILD_WPF_GUI=OFF -DBUILD_DEBUG_DEMO=OFF -DBUILD_RESOURCE_UPDATER=OFF -DWITH_EMULATOR_EXTRAS=OFF
          cmake --build build --target MaaCore --config Debug --parallel 4
      - name: Collect Debug runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force debug-runtime | Out-Null
          Get-ChildItem build/bin/Debug,src/MaaUtils/MaaDeps -Recurse -Filter *.dll | Copy-Item -Destination debug-runtime -Force
      - uses: actions/upload-artifact@v7
        with:
          name: issue-18622-debug-runtime
          path: debug-runtime
      - name: Collect local Debug CRT support
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force debug-runtime | Out-Null
          $vsRoot = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          Get-ChildItem "$vsRoot/VC/Redist/MSVC" -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'debug_nonredist.*x64.*DebugCRT' } | Copy-Item -Destination debug-runtime -Force
          Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Recurse -Filter ucrtbased.dll | Where-Object { $_.FullName -match 'x64' } | Copy-Item -Destination debug-runtime -Force
      - name: Original transition-frame regression
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/user-attachments/files/33333713/report_10-12_material-synthesis_part02.zip -OutFile report.zip
          Expand-Archive report.zip report
          @'
          import json, pathlib, re, sys
          sys.path.insert(0, 'tools')
          from maa_core_eval import CoreEval
          task = 'MiniGame@MaterialSynthesis@OperatorSelectionReady'
          image = next(pathlib.Path('report').rglob('2026.10.12-16.58.45.655_raw.png'))
          from PIL import Image
          positive = Image.new('RGB', (1280,720), (32,32,32))
          positive.paste(Image.open('resource/template/InfrastPic/Processing/ProcessingIncrease.png').convert('RGB'), (1050,270))
          positive.save('synthetic-ready.png')
          Image.new('RGB', (1280,720)).save('blank.png')
          client = sys.argv[1]
          ev = CoreEval(dll_dir='debug-runtime', global_client=None if client=='Official' else client)
          try:
              results = ev.report([image], [task, 'MiniGame@MaterialSynthesis@Workshop', 'MiniGame@MaterialSynthesis@Increase'])
              print(json.dumps(results, indent=2))
              assert not results[0]['results'][0]['hit'], 'Operator confirmation incorrectly accepts the transition frame'
              controls = ev.report(['synthetic-ready.png','blank.png'], [task])
              print(client, json.dumps(controls, indent=2))
              assert controls[0]['results'][0]['hit'], 'Ready operation control should be accepted'
              assert not controls[1]['results'][0]['hit'], 'Blank page must not be accepted'
          finally:
              ev.close()
          '@ | Set-Content regression.py
          python -m pip install pillow
          foreach ($client in 'Official','YoStarJP','YoStarEN','YoStarKR','txwy') {
            python regression.py $client
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
