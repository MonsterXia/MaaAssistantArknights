name: Issue 18622 Debug verification
on:
  push:
    branches: [codex/verify-18622-debug]
  workflow_dispatch:
    inputs:
      code_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  regression:
    if: github.event_name == 'push'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/fix-18622-synthesis-readiness
      - uses: actions/download-artifact@v8
        with:
          name: issue-18622-debug-runtime
          run-id: 39609463332
          github-token: ${{ github.token }}
          path: runtime
      - uses: actions/download-artifact@v8
        with:
          name: issue-18622-debug-crt
          run-id: 39611033460
          github-token: ${{ github.token }}
          path: runtime
      - name: Original transition-frame regression
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/user-attachments/files/33333713/report_10-12_material-synthesis_part02.zip -OutFile report.zip
          Expand-Archive report.zip report
          @'
          import json, pathlib, re, sys
          sys.path.insert(0, 'tools')
          from maa_core_eval import CoreEval
          source = pathlib.Path('src/MaaCore/Task/Infrast/InfrastProcessingTask.cpp').read_text(encoding='utf-8')
          confirm = source.split('bool asst::InfrastProcessingTask::confirm_material_synthesis_selection()')[1].split('\nbool ')[0]
          task = re.search(r'ProcessTask verify\(\*this, \{ "([^"]+)" \}\)', confirm).group(1)
          image = next(pathlib.Path('report').rglob('2026.10.12-16.58.45.655_raw.png'))
          from PIL import Image
          positive = Image.new('RGB', (1280,720), (32,32,32))
          positive.paste(Image.open('resource/template/InfrastPic/Processing/ProcessingIncrease.png').convert('RGB'), (1050,270))
          positive.save('synthetic-ready.png')
          Image.new('RGB', (1280,720)).save('blank.png')
          client = sys.argv[1]
          ev = CoreEval(dll_dir='runtime', global_client=None if client=='Official' else client)
          try:
              results = ev.report([image], [task, 'MiniGame@MaterialSynthesis@Workshop', 'MiniGame@MaterialSynthesis@Increase'])
              print(json.dumps(results, indent=2))
              assert not results[0]['results'][0]['hit'], 'Operator confirmation incorrectly accepts the transition frame'
              controls = ev.report(['synthetic-ready.png','blank.png'], [task])
              print(client, json.dumps(controls, indent=2))
              assert controls[0]['results'][0]['hit'], 'Ready operation control should be accepted'
              assert not controls[1]['results'][0]['hit'], 'Blank page must not be accepted'
          finally:
              ev.close()
          '@ | Set-Content regression.py
          python -m pip install pillow
          foreach ($client in 'Official','YoStarJP','YoStarEN','YoStarKR','txwy') {
            python regression.py $client
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  support:
    if: github.event_name == 'push'
    runs-on: windows-2025-vs2026
    steps:
      - name: Collect local Debug CRT support
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force debug-crt | Out-Null
          $vsRoot = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          Get-ChildItem "$vsRoot/VC/Redist/MSVC" -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'debug_nonredist.*x64.*DebugCRT' } | Copy-Item -Destination debug-crt -Force
          Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Recurse -Filter ucrtbased.dll | Where-Object { $_.FullName -match 'x64' } | Copy-Item -Destination debug-crt -Force
      - uses: actions/upload-artifact@v7
        with:
          name: issue-18622-debug-crt
          path: debug-crt
  debug:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref || '067a1d6852' }}
      - name: Fetch MaaUtils
        shell: bash
        run: bash .github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils
      - uses: actions/cache@v6
        id: deps-cache
        with:
          path: src/MaaUtils/MaaDeps
          key: issue-18622-windows-maadeps-${{ hashFiles('tools/maadeps-download.py') }}
      - name: Dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/maadeps-download.py x64-windows
      - name: Build Debug
        run: |
          cmake --preset windows-x64 -DBUILD_WPF_GUI=OFF -DBUILD_DEBUG_DEMO=OFF -DBUILD_RESOURCE_UPDATER=OFF -DWITH_EMULATOR_EXTRAS=OFF
          cmake --build build --target MaaCore --config Debug --parallel 4
      - name: Collect Debug runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force debug-runtime | Out-Null
          Get-ChildItem build/bin/Debug,src/MaaUtils/MaaDeps -Recurse -Filter *.dll | Copy-Item -Destination debug-runtime -Force
      - uses: actions/upload-artifact@v7
        with:
          name: issue-18622-debug-runtime
          path: debug-runtime
